# Catalogue of every runnable test unit: one entry per registry target and
# per standalone test_*.py file. Levels are ordered, so selecting a level runs
# every level below it. Labels are a set, validated against the vocabulary
# below. duration_seconds is the wall of the last actual run, written back by
# `tools/build.py tests run` and by a passing `sim test`; it is never edited by
# hand and 0.00 marks an entry nothing measured. A host unit's optional
# inputs list the data files or directories it reads; its module imports are
# derived, and external_imports names the packages outside the tree they reach.
#
# Whole-line comments only; see tools/n2m/catalogue.py for the accepted subset.
version: 1
labels:
  agents: "Agent skill helper scripts under .agents/skills."
  audio: "APU and audio service behavior."
  baseline: "The test-only baseline fixture and harness."
  builder: "The tagged build machinery of tools/n2m and tools/build.py."
  builder-fault: "Migrated regressions.json subset: deliberate aggregate failure witness."
  cartridge: "The loader profile: bank and select registers, copy engine, arbiters and KEY1 return."
  ci: "Trusted CI admission, recovery and status."
  clocking: "Clock, reset and CDC control."
  common: "Shared RTL macros, assertions and memory primitives."
  composed-smoke: "Migrated regressions.json subset: the bounded composed candidate."
  cpu: "SM83 core behavior."
  display: "Tile and pixel display paths."
  display308: "The display308 scene and program fixtures."
  dma: "FF46 OAM transfer and shared-store service."
  fault: "A deliberate negative case: the target must fail in the named way."
  flash: "The flash library boot copier fixtures in the composed system."
  fpga: "MAX 10 fit, constraint and programming host checks."
  host: "UART host transport, framing and CLI behavior."
  host-play: "The host_play input loop and its fixtures."
  input: "Input capture and control routing."
  integration: "Composed system execution through Intel-model preload."
  interfaces: "The generated interface tables shared by RTL, host and DV."
  interrupts: "IF/IE dispatch and vector entry."
  joypad: "JOYP matrix and STOP behavior."
  mbc1: "The 64 KiB MBC1 profile: bank registers, store translation, load session and exit."
  memory: "Memory stores and routing."
  menu: "The on-board game menu program, its frame reference and fixtures."
  menu-animation: "The menu's self-animating nudge phase, kept out of the menu label so that aggregate stays inside the ordinary budget."
  menu-delayed-worst: "The delayed catalogue draw at its worst alignment: a declared target wall allowance, kept out of every ordinary aggregate."
  menu-library: "The menu's catalogue paths: the accepted select, the refused one and the delayed catalogue draw, kept out of the menu label so that aggregate keeps headroom."
  milestone: "Carries the owner-authorized 1500-second Mooneye allowance."
  mooneye: "Pinned upstream Mooneye fixtures."
  needs-cocotb: "Imports cocotb; runs only on the pinned src/dv/python interpreter."
  ppu: "Pixel pipeline, OAM scan and mode timing."
  pre-merge: "Migrated regressions.json subset: the short ordinary pre-merge set."
  preload: "Intel-model program preload and its comparison."
  python-tb: "A cocotb testbench; the builder must run on the pinned interpreter."
  sameboy: "SameBoy comparison probes."
  serial: "Serial transfer and its service."
  snapshot: "Frame snapshot capture."
  springtrail: "The original Springtrail game, its reference and its fixtures."
  stackdrop: "The Stackdrop fixture game and its reference."
  storage: "The SDRAM controller and its pin-level device model."
  sw: "The original assembler, linker, packager and asset converter."
  system: "Whole-system composition above one RTL owner."
  timer: "DIV/TIMA counting and overflow."
  uart: "UART packet store and transport framing."
  v05: "The v0.5 acceptance program and its oracles."
  vga: "Frame bridge and VGA output."
  wiki: "Publication, checks and repository statistics."
external_imports:
  cocotb: "src/dv/python/requirements.txt pins cocotb 2.1.0 for the pinned src/dv/python environment."
  cocotb_tools: "Ships with the pinned cocotb 2.1.0 distribution."
  find_libpython: "src/dv/python/requirements.txt pins find-libpython 0.4.1."
  markdown: "tools/wiki/requirements.txt pins Markdown 3.10.3 for the site build."
  serial: "tools/n2m/host/THIRD_PARTY.md records the optional pySerial 3.5 physical backend."
