<svg xmlns="http://www.w3.org/2000/svg" width="920" height="550" viewBox="0 0 920 550" role="img" aria-labelledby="t d">
<title id="t">Tile assets: separate preview and ROM paths</title><desc id="d">Tile atlases feed two paths. Placement maps and atlases compose review images only. Tile atlases are encoded and linked with game software into ROMs; runtime placement belongs to game code.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b1dc76"/></marker></defs>
<rect width="920" height="550" fill="#101810"/>
<g font-family="Consolas, Liberation Mono, monospace" fill="#d5e8ae">
<text x="24" y="34" font-size="22">[ ASSET BUILD ]  TWO PATHS FROM TILE ART</text>
<g fill="#172617" stroke="#799b5e"><rect x="240" y="64" width="440" height="70"/>
<rect x="25" y="194" width="405" height="90"/><rect x="490" y="194" width="405" height="90"/>
<rect x="25" y="334" width="405" height="90"/><rect x="490" y="334" width="405" height="90"/></g>
<text x="258" y="91" font-size="18">EDITABLE TILE ATLASES</text><text x="258" y="116" font-size="15">Original 8×8 integer shade grids</text>
<path d="M460 134 V160 H225 V191 M460 160 H692 V191 M225 284 V331 M692 284 V331" fill="none" stroke="#b1dc76" stroke-width="2" marker-end="url(#a)"/>
<text x="42" y="219" font-size="18">PREVIEW / COMPOSE</text><text x="42" y="246" font-size="15">Atlases + review placement maps</text><text x="42" y="269" font-size="15">Inspect poses, reuse and flips</text>
<text x="507" y="219" font-size="18">ROM / ENCODE</text><text x="507" y="246" font-size="15">Tile atlases → two bitplanes</text><text x="507" y="269" font-size="15">16 bytes per 8×8 tile</text>
<text x="42" y="361" font-size="18">REVIEW SHEETS</text><text x="42" y="388" font-size="15">Check art before integration</text><text x="42" y="411" font-size="15">Maps do not enter ROM encoding</text>
<text x="507" y="361" font-size="18">LINK / EXECUTE</text><text x="507" y="388" font-size="15">Encoded tiles + SM83 game code</text><text x="507" y="411" font-size="15">ROM → FPGA → captured pixels</text>
<text x="25" y="480" font-size="15">Runtime placement is implemented by game code.</text>
<text x="25" y="506" font-size="15">Review-bank IDs are not ROM sections or VRAM tile IDs.</text>
</g></svg>