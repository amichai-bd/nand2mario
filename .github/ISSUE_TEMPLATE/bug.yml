name: Bug
description: Report incorrect or unexpected behavior.
labels:
  - "type:bug"
body:
  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Summarize the issue in one or two sentences.
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Specification reference
      description: Link the governing wiki page or gap. State the planned path if it is missing.
      placeholder: wiki/src/... or Missing - wiki/src/...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where is the problem?
      options:
        - RTL
        - DV
        - Software
        - FPGA
        - Tools
        - Wiki
        - Agents
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happens now?
    validations:
      required: true

  - type: textarea
    id: recreate
    attributes:
      label: How to recreate
      description: Give the smallest exact sequence that shows the problem.
      placeholder: |
        Build tag:
        Commit:
        Command:
        Result:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add useful logs, traces, waves, screenshots, or reports.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the required end state in one sentence.
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      description: List three to five observable checks that prove the fix.
      placeholder: |
        - [ ] The smallest recreation passes.
        - [ ] A regression test covers the failure.
        - [ ] Required checks pass.
    validations:
      required: true
