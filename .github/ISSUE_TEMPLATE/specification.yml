name: Specification
description: Define or change one design contract or decision.
labels:
  - "type:spec"
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this specification govern?
      options:
        - RTL
        - DV
        - Software
        - FPGA
        - Tools
        - Wiki
        - Agents
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Specification goal
      description: State the behavior or decision that must become clear.
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: What is missing, ambiguous, or inconsistent today?
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Required contract
      description: List the interfaces, behavior, edge cases, or decisions to define.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the specification is complete and usable?
      placeholder: |
        - [ ] Behavior is observable and unambiguous.
        - [ ] Interfaces and edge cases are defined.
        - [ ] Verification can derive tests from the specification.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link primary sources, related issues, or affected files.
