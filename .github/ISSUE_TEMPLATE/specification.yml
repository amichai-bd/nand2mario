name: Specification
description: Define or change one design contract or decision.
labels:
  - "type:spec"
body:
  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Summarize the issue in one or two sentences.
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Specification reference
      description: Link the existing page or gap. For a new page, state its planned path.
      placeholder: wiki/... or New - wiki/src/...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this specification govern?
      options:
        - RTL
        - DV
        - Software
        - FPGA
        - Tools
        - Wiki
        - Agents
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: What is missing, ambiguous, or inconsistent today?
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Required contract
      description: List the interfaces, behavior, edge cases, or decisions to define.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Supporting references
      description: Link primary sources, related issues, or affected files.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the required end state in one sentence.
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      description: List three to five checks that make the specification usable.
      placeholder: |
        - [ ] Behavior is observable and unambiguous.
        - [ ] Interfaces and edge cases are defined.
        - [ ] Verification can derive tests from the specification.
    validations:
      required: true
