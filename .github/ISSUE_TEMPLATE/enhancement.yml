name: Enhancement
description: Propose one new or improved behavior.
labels:
  - "type:enhancement"
body:
  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Summarize the issue in one or two sentences.
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Specification reference
      description: Link the governing wiki page or gap. State the planned path if it is missing.
      placeholder: wiki/src/... or Missing - wiki/src/...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project owns this behavior?
      options:
        - RTL
        - DV
        - Software
        - FPGA
        - Tools
        - Wiki
        - Agents
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Current behavior
      description: What exists today, and why is it insufficient?
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed behavior
      description: Describe the externally visible change without prescribing unnecessary implementation.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Name adjacent work that this issue will not include.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the required end state in one sentence.
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      description: List three to five observable checks that prove completion.
      placeholder: |
        - [ ] Observable result one
        - [ ] Observable result two
        - [ ] Required checks pass.
    validations:
      required: true
