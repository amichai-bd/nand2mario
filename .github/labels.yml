# Canonical GitHub label catalog. Keep labels few and orthogonal.
labels:
  - name: "type:bug"
    color: "d73a4a"
    description: "Incorrect or unexpected behavior"
  - name: "type:enhancement"
    color: "1d76db"
    description: "New or improved behavior"
  - name: "type:spec"
    color: "8250df"
    description: "Specification or design decision"
  - name: "type:chore"
    color: "6e7781"
    description: "Maintenance without product behavior changes"

  - name: "area:rtl"
    color: "0052cc"
    description: "Synthesizable RTL"
  - name: "area:dv"
    color: "0e8a16"
    description: "Design verification and formal checks"
  - name: "area:sw"
    color: "fbca04"
    description: "Target software and ROM sources"
  - name: "area:fpga"
    color: "c5def5"
    description: "DE10-Lite integration and hardware"
  - name: "area:tools"
    color: "5319e7"
    description: "Build, automation, UART CLI, and host tools"
  - name: "area:wiki"
    color: "0075ca"
    description: "Specifications and documentation"
  - name: "area:agents"
    color: "bfdadc"
    description: "Agent rules and skills"

  - name: "priority:p0"
    color: "b60205"
    description: "Blocks the current milestone"
  - name: "priority:p1"
    color: "d93f0b"
    description: "Needed in the current or next milestone"
  - name: "priority:p2"
    color: "fbca04"
    description: "Planned for a later milestone"

  - name: "needs:decision"
    color: "e99695"
    description: "Requires a design or scope decision"
  - name: "needs:hardware"
    color: "f9d0c4"
    description: "Requires the physical FPGA or connected equipment"
  - name: "status:blocked"
    color: "000000"
    description: "Cannot proceed until a stated dependency is resolved"
