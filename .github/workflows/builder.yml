name: Builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  builder:
    name: Builder check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"
      - name: Check host contracts only
        run: |
          python tools/n2m/interfaces.py --check
          python tools/build.py check --tag ci-check --json
      - name: Check pinned upstream RGBDS oracle
        run: python tools/build.py sw oracle --tag ci-rgbds --json
      - name: Report simulation scope
        run: |
          echo "Host contracts and the actual pinned RGBDS oracle. Licensed Questa simulation is not run on hosted PR jobs; actual local evidence is required until the trusted route in issue #32 is configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: builder-evidence
          path: |
            workdir/builds/
          if-no-files-found: ignore
