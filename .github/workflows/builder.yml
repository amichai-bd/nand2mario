name: Builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  builder:
    name: Builder check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"
      - name: Check host contracts only
        run: |
          python tools/n2m/interfaces.py --check
          python tools/build.py check --tag ci-check --json
          python -m unittest discover -s tools/ci/tests -v
      - name: Check pinned upstream RGBDS oracle
        run: python tools/build.py sw oracle --tag ci-rgbds --json
      - name: Check complete assembler and deliberate encoding mutation
        run: |
          python tools/build.py sw assemble assembler-basic --tag ci-assembler --json
          python tools/build.py sw conformance --tag ci-conformance --json
          if python tools/build.py sw conformance --tag ci-conformance --offline --mutate --json; then
            echo "Deliberate encoding mutation unexpectedly passed"
            exit 1
          fi
          python -c "import json; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-conformance/manifest.json').read_text()); assert r['status']=='FAIL' and r['error']=='encoding mismatch offset=0 actual=01 expected=00' and r['cases']==569 and r['base_opcodes']==244 and r['cb_opcodes']==256"
      - name: Check linking and independent cartridge packaging
        run: |
          python tools/build.py sw build linker-basic --tag ci-linker --json
          python tools/build.py sw link-conformance --tag ci-link-proof --json
          if python tools/build.py sw link-conformance --tag ci-link-proof --offline --mutate relocation --json; then
            echo "Deliberate relocation mutation unexpectedly passed"
            exit 1
          fi
          python -c "import json; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-link-proof/manifest.json').read_text()); assert r['status']=='FAIL' and r['error']=='relocation mismatch offset=513 actual=81 expected=80'"
          if python tools/build.py sw link-conformance --tag ci-link-proof --offline --mutate checksum --json; then
            echo "Deliberate checksum mutation unexpectedly passed"
            exit 1
          fi
          python -c "import json; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-link-proof/manifest.json').read_text()); assert r['status']=='FAIL' and r['error']=='package checksum/header mismatch'"
      - name: Check original shade assets and deliberate encoding faults
        run: |
          python tools/build.py sw asset-conformance --tag ci-assets --json
          if python tools/build.py sw asset-conformance --tag ci-assets --mutate planes --json; then
            echo "Swapped bitplanes unexpectedly passed"
            exit 1
          fi
          python -c "import json; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-assets/manifest.json').read_text()); assert r['status']=='FAIL' and r['error']=='asset pixel mismatch x=1 y=0 expected=1 actual=2'"
          if python tools/build.py sw asset-conformance --tag ci-assets --mutate bitorder --json; then
            echo "Reversed bit order unexpectedly passed"
            exit 1
          fi
          python -c "import json; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-assets/manifest.json').read_text()); assert r['status']=='FAIL' and r['error']=='asset pixel mismatch x=0 y=0 expected=0 actual=3'"
      - name: Reject pixel, row and tile position permutations
        run: |
          for mode in columns rows tiles; do
            if python tools/build.py sw asset-conformance --tag ci-assets --mutate "$mode" --json; then
              echo "Position permutation unexpectedly passed"
              exit 1
            fi
            python -c "import json,sys; from pathlib import Path; r=json.loads(Path('workdir/builds/ci-assets/manifest.json').read_text()); expected='asset pixel mismatch x=0 y=0 expected=0 actual=1' if sys.argv[1]=='tiles' else 'asset basis case=1: asset pixel mismatch x=0 y=0 expected=1 actual=0'; assert r['status']=='FAIL' and r['error']==expected" "$mode"
          done
      - name: Check Springtrail host verification fixtures
        run: |
          python - <<'PY'
          import importlib, pathlib, sys, unittest
          start = pathlib.Path('src/dv/springtrail')
          sys.path.insert(0, str(start))
          suite, simulator = unittest.TestSuite(), []
          # Host fixtures that reach cocotb through an import chain. Each entry
          # is a test this step cannot run; keep the set small and justified.
          transitive = {'test_hud_unit_check.py'}
          for path in sorted(start.glob('test_*.py')):
              try:
                  module = importlib.import_module(path.stem)
              except ModuleNotFoundError as error:
                  # Simulator entry points need cocotb, whose pinned 2.0.1 release
                  # does not build for this interpreter. They register work through
                  # @cocotb.test(); a module defining unittest cases is a host
                  # fixture, so skipping it would hide the tests this step runs.
                  if error.name != 'cocotb':
                      raise
                  if 'TestCase' in path.read_text(encoding='utf-8') and path.name not in transitive:
                      sys.exit(f'{path.name} defines unittest cases but cannot import cocotb; '
                               'make it importable without the simulator, or add it to '
                               'transitive above with the reason')
                  simulator.append(path.name)
                  continue
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          print('simulator entry modules not run here:', ' '.join(simulator))
          sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY
      - name: Report simulation scope
        run: |
          echo "Host contracts and the actual pinned RGBDS oracle. Licensed Questa simulation is not run on hosted PR jobs; actual local evidence is required until the trusted route in issue #32 is configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: builder-evidence
          path: |
            workdir/builds/
          if-no-files-found: ignore
