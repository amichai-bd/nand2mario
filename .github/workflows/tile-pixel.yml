name: Tile pixel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tile-pixel:
    name: Tile pixel simulation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"
      - name: Check out Icarus 12.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: steveicarus/iverilog
          ref: 4fd5291632232fbe1ba49b2c26bb6b2bf1c6c9cf
          path: workdir/tools/iverilog-source
          persist-credentials: false
      - name: Build pinned simulator
        working-directory: workdir/tools/iverilog-source
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex gperf build-essential
          sh autoconf.sh
          ./configure --prefix="$GITHUB_WORKSPACE/workdir/tools/iverilog"
          make -j2
          make install
          echo "$GITHUB_WORKSPACE/workdir/tools/iverilog/bin" >> "$GITHUB_PATH"
      - name: Check runner behavior
        run: python -m unittest discover -s tools/sim -p test_tile_pixel.py -v
      - name: Compile, elaborate, and check pixels
        run: python tools/sim/tile_pixel.py --sim icarus --tag ci-tile-pixel
      - name: Retain simulation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tile-pixel-evidence
          path: workdir/builds/
          if-no-files-found: ignore
