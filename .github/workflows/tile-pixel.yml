name: Tile pixel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tile-pixel:
    name: Tile pixel simulation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"
      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex gperf build-essential
      - name: Build pinned simulator
        run: |
          python tools/n2m/bootstrap.py
          echo "$GITHUB_WORKSPACE/workdir/tools/iverilog/bin" >> "$GITHUB_PATH"
      - name: Check builder and standalone runner behavior
        run: |
          python tools/build.py check --tag ci-tile-check --json
          python -m unittest discover -s tools/sim -p test_tile_pixel.py -v
      - name: Compile, elaborate, and check pixels
        run: |
          python tools/build.py sim test tile-pixel --sim icarus --tag ci-tile-pixel --json
          python tools/build.py sim test tile-pixel-corrupt --sim icarus --tag ci-tile-corrupt --json
          python tools/build.py sim test tile-pixel --sim icarus --tag ci-tile-pixel --json
          python tools/build.py sim test tile-pixel-corrupt --sim icarus --tag ci-tile-corrupt --json
          python - <<'PY'
          import json, pathlib
          for tag in ("ci-tile-pixel", "ci-tile-corrupt"):
              result = json.loads((pathlib.Path("workdir/builds") / tag / "manifest.json").read_text())
              assert result["status"] == "PASS" and result["cache"] == "CACHED"
          PY
      - name: Retain simulation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tile-pixel-evidence
          path: |
            workdir/builds/
            workdir/logs/iverilog-bootstrap.log
          if-no-files-found: ignore
