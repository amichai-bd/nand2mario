name: PR policy

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and closing issues
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import sys
          import urllib.error
          import urllib.request

          branch = os.environ.get("PR_BRANCH", "")
          base = os.environ.get("PR_BASE", "")
          body = os.environ.get("PR_BODY", "")
          title = os.environ.get("PR_TITLE", "")
          repository = os.environ.get("GH_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          if base != "main":
              print("::error::Pull requests must target main.")
              sys.exit(1)

          # Automated statistics refresh (owner authorization 2026-09-11, issue #392):
          # the only class that merges without independent review. Every field is
          # fixed and the diff must be the regenerated snapshot alone.
          if re.fullmatch(r"stats-refresh-\d{8}T\d{6}Z", branch):
              if not re.fullmatch(r"stats: refresh snapshot to [0-9a-f]{7}", title):
                  print("::error::Automated refresh title must be 'stats: refresh snapshot to <sha7>'.")
                  sys.exit(1)
              if not re.search(r"(?m)^Refs #392\s*$", body):
                  print("::error::Automated refresh body must contain a 'Refs #392' line.")
                  sys.exit(1)
              if re.search(r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#", body):
                  print("::error::Automated refresh must not close issues.")
                  sys.exit(1)
              number = os.environ.get("PR_NUMBER", "")
              try:
                  files = api(f"pulls/{number}/files?per_page=100")
              except urllib.error.HTTPError as error:
                  print(f"::error::Could not read changed files of PR #{number}: HTTP {error.code}.")
                  sys.exit(1)
              changed = sorted(entry["filename"] for entry in files)
              if changed != ["wiki/statistics.html"] or files[0].get("status") != "modified":
                  print(
                      "::error::Automated refresh may change only wiki/statistics.html; "
                      f"changed: {', '.join(changed) or 'nothing'}."
                  )
                  sys.exit(1)
              print(f"PR policy passed: {branch} is an automated statistics refresh; refs #392.")
              sys.exit(0)

          # Every other PR: the snapshot is generated output owned by the refresh
          # (issue #442). A branch cut before a refresh and merged with main would
          # carry the older file back as an apparent edit, so refuse it here.
          number = os.environ.get("PR_NUMBER", "")
          files = []
          page = 1
          while True:
              try:
                  batch = api(f"pulls/{number}/files?per_page=100&page={page}")
              except urllib.error.HTTPError as error:
                  print(f"::error::Could not read changed files of PR #{number}: HTTP {error.code}.")
                  sys.exit(1)
              files.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          # A rename reports the new path as filename and the old one as
          # previous_filename; both directions count as changing the snapshot.
          if any("wiki/statistics.html" in (entry["filename"], entry.get("previous_filename"))
                 for entry in files):
              print(
                  "::error::wiki/statistics.html is generated by the automated statistics "
                  "refresh and may change only in a stats-refresh-* PR; rebase onto main "
                  "to drop the stale snapshot."
              )
              sys.exit(1)

          # RTL and FPGA changes carry the Questa compile gate's evidence for the
          # PR head (wiki/tools/n2m/SPEC.md#questa-compile-gate). The gate runs
          # locally on Windows; this check only refuses to merge without its
          # record, so the body must be updated after every push.
          rtl_changed = sorted(
              name for entry in files
              for name in (entry["filename"], entry.get("previous_filename"))
              if name and name.startswith(("src/rtl/", "src/fpga/")))
          if rtl_changed:
              head = os.environ.get("PR_HEAD_SHA", "").lower()
              text = body.replace("\r\n", "\n")
              gate_help = ("see wiki/agents/pull-requests.md#hosted-and-local-checks and "
                           "wiki/tools/n2m/SPEC.md#questa-compile-gate")
              # Any fence info string is accepted; the first line identifies the block.
              pairs = [
                  re.findall(r"(?m)^([a-z_]+):[ \t]*(.*?)[ \t]*$", found)
                  for found in re.findall(r"```[^\n]*\n(Questa compile gate\n.*?)```", text, re.S)
              ]
              duplicates = sorted({key for found in pairs for key, _ in found
                                   if [k for k, _ in found].count(key) > 1})
              if duplicates:
                  print(
                      "::error::Questa compile gate evidence block repeats "
                      f"{', '.join(duplicates)}; keep one line per field; {gate_help}."
                  )
                  sys.exit(1)
              blocks = [dict(found) for found in pairs]
              if not blocks:
                  print(
                      "::error::Changed files under src/rtl or src/fpga "
                      f"({', '.join(rtl_changed)}) need a 'Questa compile gate' evidence "
                      f"block in the PR body; {gate_help}."
                  )
                  sys.exit(1)
              heads = [block.get("head", "").lower() for block in blocks]
              current = [
                  block for block, block_head in zip(blocks, heads)
                  if re.fullmatch(r"[0-9a-f]{7,40}", block_head) and head.startswith(block_head)
              ]
              if not current:
                  print(
                      "::error::Questa compile gate evidence names head "
                      f"{', '.join(heads) or 'nothing'} but the PR head is {head[:7]}; "
                      "rerun 'python tools/build.py lint questa --tag <tag> --json' on "
                      f"the current head and update the block; {gate_help}."
                  )
                  sys.exit(1)
              gate = current[-1]
              missing = [key for key in ("vlog", "vopt", "sources", "tops", "elapsed_seconds",
                                         "attempt_result", "status") if not gate.get(key)]
              if missing:
                  print(
                      "::error::Questa compile gate evidence block lacks "
                      f"{', '.join(missing)}; {gate_help}."
                  )
                  sys.exit(1)
              if gate["status"] != "PASS":
                  print(
                      f"::error::Questa compile gate at {head[:7]} reports status "
                      f"{gate['status']}; the RTL or FPGA change may not merge until the "
                      f"gate is PASS on the PR head; {gate_help}."
                  )
                  sys.exit(1)
              if not all(re.fullmatch(r"[1-9][0-9]*", gate[key]) for key in ("sources", "tops")) \
                      or not re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", gate["elapsed_seconds"]):
                  print(
                      "::error::Questa compile gate evidence needs integer sources and tops "
                      f"counts and a numeric elapsed_seconds; {gate_help}."
                  )
                  sys.exit(1)
              print(f"Questa compile gate PASS recorded for head {head[:7]}: "
                    f"{gate['sources']} sources, {gate['tops']} tops, {gate['elapsed_seconds']} s.")

          match = re.fullmatch(
              r"([1-9][0-9]*)-[a-z0-9]+(?:-[a-z0-9]+)*",
              branch,
          )
          if not match:
              print(
                  "::error::Branch must match "
                  "<primary-number>-<lowercase-slug>."
              )
              sys.exit(1)

          primary_issue = match.group(1)
          closing_issues = set(
              re.findall(r"(?i)\bcloses\s+#([1-9][0-9]*)\b", body)
          )
          # User-authorized checkpoints; acceptance stayed in the linked issue at merge.
          checkpoints = {"162": "156", "163": "88", "167": "164", "169": "168", "179": "168"}
          checkpoint = checkpoints.get(os.environ.get("PR_NUMBER", ""))
          if checkpoint:
              if primary_issue != checkpoint or not re.search(
                  rf"(?m)^Checkpoint for #{checkpoint}\s*$", body
              ) or not re.search(rf"(?m)^Refs #{checkpoint}\s*$", body):
                  print("::error::Approved checkpoint must reference its exact primary issue.")
                  sys.exit(1)
              if re.search(r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#", body):
                  print("::error::Checkpoint must not close acceptance issues.")
                  sys.exit(1)
              linked_issues = {checkpoint}
          elif not closing_issues:
              print("::error::PR body must contain at least one Closes #<number>.")
              sys.exit(1)
          elif primary_issue not in closing_issues:
              print(
                  f"::error::PR must close primary issue #{primary_issue} "
                  "from the branch name."
              )
              sys.exit(1)
          else:
              linked_issues = closing_issues

          issue_owners = {}
          for issue_number in sorted(linked_issues, key=int):
              try:
                  issue = api(f"issues/{issue_number}")
              except urllib.error.HTTPError as error:
                  print(
                      f"::error::Could not read closing issue #{issue_number}: "
                      f"HTTP {error.code}."
                  )
                  sys.exit(1)

              if "pull_request" in issue:
                  print(f"::error::#{issue_number} is a pull request, not an issue.")
                  sys.exit(1)

              if issue.get("state") != "open":
                  print(f"::error::Closing issue #{issue_number} must be open.")
                  sys.exit(1)

              if not issue.get("assignees"):
                  print(f"::error::Closing issue #{issue_number} needs an assignee.")
                  sys.exit(1)

              issue_owners[issue_number] = ", ".join(
                  f"@{assignee['login']}" for assignee in issue["assignees"]
              )

          linked = ", ".join(f"#{number}" for number in sorted(linked_issues, key=int))
          owners = "; ".join(
              f"#{number}: {issue_owners[number]}"
              for number in sorted(issue_owners, key=int)
          )
          action = "checkpoints" if checkpoint else "closes"
          print(f"PR policy passed: {branch} {action} {linked}; {owners}.")
          PY
