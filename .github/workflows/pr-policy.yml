name: PR policy

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and closing issues
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import sys
          import urllib.error
          import urllib.request

          branch = os.environ.get("PR_BRANCH", "")
          body = os.environ.get("PR_BODY", "")

          match = re.fullmatch(
              r"issue/([1-9][0-9]*)-[a-z0-9]+(?:-[a-z0-9]+)*",
              branch,
          )
          if not match:
              print(
                  "::error::Branch must match "
                  "issue/<primary-number>-<lowercase-slug>."
              )
              sys.exit(1)

          primary_issue = match.group(1)
          closing_issues = set(
              re.findall(r"(?i)\bcloses\s+#([1-9][0-9]*)\b", body)
          )
          if not closing_issues:
              print("::error::PR body must contain at least one Closes #<number>.")
              sys.exit(1)

          if primary_issue not in closing_issues:
              print(
                  f"::error::PR must close primary issue #{primary_issue} "
                  "from the branch name."
              )
              sys.exit(1)

          repository = os.environ.get("GH_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/{primary_issue}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  issue = json.load(response)
          except urllib.error.HTTPError as error:
              print(
                  f"::error::Could not read primary issue #{primary_issue}: "
                  f"HTTP {error.code}."
              )
              sys.exit(1)

          if "pull_request" in issue:
              print(f"::error::#{primary_issue} is a pull request, not an issue.")
              sys.exit(1)

          if not issue.get("assignees"):
              print(f"::error::Primary issue #{primary_issue} must have an assignee.")
              sys.exit(1)

          closed = ", ".join(f"#{number}" for number in sorted(closing_issues, key=int))
          assignees = ", ".join(
              f"@{assignee['login']}" for assignee in issue["assignees"]
          )
          print(f"PR policy passed: {branch} closes {closed}; owner: {assignees}.")
          PY
