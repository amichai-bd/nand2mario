name: PR policy

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and closing issues
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import sys
          import urllib.error
          import urllib.request

          branch = os.environ.get("PR_BRANCH", "")
          base = os.environ.get("PR_BASE", "")
          body = os.environ.get("PR_BODY", "")

          match = re.fullmatch(
              r"([1-9][0-9]*)-[a-z0-9]+(?:-[a-z0-9]+)*",
              branch,
          )
          if not match:
              print(
                  "::error::Branch must match "
                  "<primary-number>-<lowercase-slug>."
              )
              sys.exit(1)

          if base != "main":
              print("::error::Pull requests must target main.")
              sys.exit(1)

          primary_issue = match.group(1)
          closing_issues = set(
              re.findall(r"(?i)\bcloses\s+#([1-9][0-9]*)\b", body)
          )
          # User-authorized checkpoints; full acceptance stays in the linked issue.
          checkpoints = {"162": "156", "163": "88", "167": "164", "169": "168", "179": "168"}
          checkpoint = checkpoints.get(os.environ.get("PR_NUMBER", ""))
          if checkpoint:
              if primary_issue != checkpoint or not re.search(
                  rf"(?m)^Checkpoint for #{checkpoint}\s*$", body
              ) or not re.search(rf"(?m)^Refs #{checkpoint}\s*$", body):
                  print("::error::Approved checkpoint must reference its exact primary issue.")
                  sys.exit(1)
              if re.search(r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#", body):
                  print("::error::Checkpoint must not close acceptance issues.")
                  sys.exit(1)
              linked_issues = {checkpoint}
          elif not closing_issues:
              print("::error::PR body must contain at least one Closes #<number>.")
              sys.exit(1)
          elif primary_issue not in closing_issues:
              print(
                  f"::error::PR must close primary issue #{primary_issue} "
                  "from the branch name."
              )
              sys.exit(1)
          else:
              linked_issues = closing_issues

          repository = os.environ.get("GH_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          issue_owners = {}
          for issue_number in sorted(linked_issues, key=int):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{issue_number}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      issue = json.load(response)
              except urllib.error.HTTPError as error:
                  print(
                      f"::error::Could not read closing issue #{issue_number}: "
                      f"HTTP {error.code}."
                  )
                  sys.exit(1)

              if "pull_request" in issue:
                  print(f"::error::#{issue_number} is a pull request, not an issue.")
                  sys.exit(1)

              if issue.get("state") != "open":
                  print(f"::error::Closing issue #{issue_number} must be open.")
                  sys.exit(1)

              if not issue.get("assignees"):
                  print(f"::error::Closing issue #{issue_number} needs an assignee.")
                  sys.exit(1)

              issue_owners[issue_number] = ", ".join(
                  f"@{assignee['login']}" for assignee in issue["assignees"]
              )

          linked = ", ".join(f"#{number}" for number in sorted(linked_issues, key=int))
          owners = "; ".join(
              f"#{number}: {issue_owners[number]}"
              for number in sorted(issue_owners, key=int)
          )
          action = "checkpoints" if checkpoint else "closes"
          print(f"PR policy passed: {branch} {action} {linked}; {owners}.")
          PY
