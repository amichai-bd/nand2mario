name: Wiki

# Dispatch only. Pull requests run the PR policy check; authors run these
# commands locally before merge (wiki/agents/pull-requests.md). The Pages
# workflow repeats the wiki build and browser check on main before publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki:
    name: Wiki check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"
          cache: pip
          cache-dependency-path: tools/wiki/requirements*.txt
      - name: Test issue helper
        run: python -m unittest discover -s .agents/skills/issue-author/scripts -p test_create_issue.py -v
      - name: Check SystemVerilog declaration style
        run: |
          python -m unittest discover -s .agents/skills/rtl-coder/scripts -p test_check_sv_style.py -v
          python .agents/skills/rtl-coder/scripts/check_sv_style.py
      - name: Check work caps
        run: |
          python -m unittest discover -s .agents/skills/update-crewmates/scripts -p test_update_caps.py -v
          python .agents/skills/update-crewmates/scripts/update_caps.py --check
      - name: Build and check wiki
        run: python tools/wiki/check.py --browser --install-browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wiki-browser-failure
          path: |
            workdir/wiki/browser/result.json
            workdir/wiki/browser/trace.zip
            workdir/wiki/browser/failure.png
          if-no-files-found: ignore
